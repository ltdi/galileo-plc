<svg xmlns="http://www.w3.org/2000/svg" width="680" height="506" viewBox="0 0 680 506" role="img">
<title>Cómo se conectan las partes del PLC didáctico</title>
<desc>El lanzador abre el editor, el puente local y el navegador. El editor y el navegador hablan con el puente; el puente carga programas y lee por Modbus en la placa Galileo.</desc>
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.fondo{fill:#ffffff}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.gris{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.mor{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.mor-t .th{fill:#3C3489}.mor-t .ts{fill:#534AB7}
.cont{fill:none;stroke:#7F77DD;stroke-width:.5;stroke-dasharray:5 4}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
@media (prefers-color-scheme:dark){
.fondo{fill:#1f1f1e}
.th{fill:#F1EFE8}.ts{fill:#B4B2A9}
.gris{fill:#2C2C2A;stroke:#B4B2A9}
.mor{fill:#3C3489;stroke:#AFA9EC}
.mor-t .th{fill:#EEEDFE}.mor-t .ts{fill:#CECBF6}
.arr{stroke:#B4B2A9}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="fondo" width="680" height="506"/>
<rect class="gris" x="240" y="30" width="200" height="56" rx="8"/>
<text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Lanzador</text>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">lanzar_plc.py</text>
<rect class="gris" x="40" y="120" width="160" height="56" rx="8"/>
<text class="th" x="120" y="139" text-anchor="middle" dominant-baseline="central">OpenPLC Editor</text>
<text class="ts" x="120" y="158" text-anchor="middle" dominant-baseline="central">versión 4.3.5</text>
<rect class="gris" x="480" y="120" width="160" height="56" rx="8"/>
<text class="th" x="560" y="139" text-anchor="middle" dominant-baseline="central">Navegador</text>
<text class="ts" x="560" y="158" text-anchor="middle" dominant-baseline="central">ventana de Firefox</text>
<rect class="cont" x="40" y="215" width="600" height="130" rx="12"/>
<text class="ts" x="340" y="233" text-anchor="middle">Puente local · puente_local.py</text>
<g class="mor-t"><rect class="mor" x="60" y="250" width="240" height="72" rx="8"/>
<text class="th" x="180" y="270" text-anchor="middle" dominant-baseline="central">Runtime OpenPLC emulado</text>
<text class="ts" x="180" y="288" text-anchor="middle" dominant-baseline="central">servidor_runtime.py</text>
<text class="ts" x="180" y="305" text-anchor="middle" dominant-baseline="central">HTTPS en 127.0.0.N</text></g>
<g class="mor-t"><rect class="mor" x="380" y="250" width="240" height="72" rx="8"/>
<text class="th" x="500" y="270" text-anchor="middle" dominant-baseline="central">Panel en vivo</text>
<text class="ts" x="500" y="288" text-anchor="middle" dominant-baseline="central">panel_vivo.py</text>
<text class="ts" x="500" y="305" text-anchor="middle" dominant-baseline="central">127.0.0.1:8088</text></g>
<rect class="gris" x="220" y="410" width="240" height="56" rx="8"/>
<text class="th" x="340" y="429" text-anchor="middle" dominant-baseline="central">Placa Galileo</text>
<text class="ts" x="340" y="448" text-anchor="middle" dominant-baseline="central">OpenPLC + receptor de carga</text>
<line class="arr" x1="290" y1="86" x2="130" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="390" y1="86" x2="550" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="86" x2="340" y2="213" marker-end="url(#arrow)"/>
<line class="arr" x1="120" y1="178" x2="120" y2="248" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="560" y1="178" x2="560" y2="248" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="250" y1="324" x2="250" y2="408" marker-end="url(#arrow)"/>
<line class="arr" x1="430" y1="324" x2="430" y2="408" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="258" y="372">carga 9100 y 9101</text>
<text class="ts" x="438" y="372">Modbus 502</text>
<text class="ts" x="132" y="198">Search y Build and upload</text>
</svg>
